# university-sync 設定の雛形。実設定は ~/.config/university-sync/config.toml に置く（リポジトリに入れない）。
# 空欄は「未確定」。推測で埋めない。`university-sync doctor` で未入力項目が一覧になる。

[vault]
path = "~/path/to/ObsidianVault"   # Obsidian Vault の場所
tasks_note = "Areas/タスク管理/大学.md"
university_root = "Areas/University"
review_inbox = "Inbox/大学_自動取込"
protected_paths = ["Note/", "タスク置き場.md"]

[state]
# Vault・Drive・ソース管理の外。OAuth トークンはここにも置かず macOS キーチェーンへ
dir = "~/Library/Application Support/university-sync"

[source]
mode = "sample"            # sample（Phase 0）/ google（Phase 1 以降）
sample_dir = "fixtures/sample_v1"   # この設定ファイルからの相対パスでも可

[google]
client_secrets_path = ""   # OAuth クライアント（デスクトップアプリ）の JSON。Vault 外に置く

[accounts.school]
email = ""                 # 学校アカウントの完全なメールアドレス
mail_backend = ""          # "gmail" など。確認してから入れる

[accounts.storage]
email = ""                 # 保存先 Drive のアカウントの完全なメールアドレス
drive_folder_id = ""       # 「大学資料」フォルダの ID
deadline_calendar_id = ""  # 締切を登録するカレンダーの ID（例: xxxx@group.calendar.google.com）。空なら登録しない。設定後に `university-sync auth storage` を再実行
class_calendar_id = ""     # 授業の予定を入れたカレンダーの ID。試験と重なる授業の回を消す。空なら消さない

# 対象授業。`university-sync courses` の結果から選んで追記する
# [[courses]]
# course_id = ""
# course_key = ""          # 省略時は course_id
# name = ""                # タスク行に出す科目名
# vault_dir = ""           # 例: Areas/University/論理回路学（既存フォルダは移動・改名しない）
# term = ""                # 例: 2026後期

# 見込みの締切。毎週決まった曜日に課題が出る授業向け。先にカレンダーへ入れておき、
# Classroom に課題が出て締切が ±3 日以内なら、その予定を課題の予定に置き換える（重複させない）
# [[calendar_slots]]
# course_id = ""
# title = ""               # 例: 〇〇 レポート提出（見込み）
# note = ""                # 予定の説明欄に書く補足
# deadlines = []           # 例: ["2026-10-23T23:59", "2026-10-30T23:59"]（JST）

[mail]
# initial_range_days = 30  # 初回取得範囲（日数）。未確定
query = ""                 # Gmail 検索条件。未確定

[schedule]
daily_time = ""            # 初期候補 07:00 JST。未確定

[notify]
channel = ""               # 未確定。決まるまで外部送信しない
approaching_days = []      # 例: [3, 1]。未確定

[llm]
mode = ""                  # Claude の実行方式。未確定

[sync]
auto_complete_on_turned_in = true   # 学校側 TURNED_IN で管理タスクを完了にする
